<svg xmlns="http://www.w3.org/2000/svg" width="720.0" height="288.0" viewBox="0 0 720.0 288.0" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Sharpe ratio: selection period vs test period</title>
<desc id="chart-desc">Parameters chosen on 2014–2019, then run unchanged on 2020–2024. Average of 29 symbols.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,0.10)}
.title{fill:#0b0b0b;font-size:16px;font-weight:600}
.sub{fill:#52514e;font-size:13px}
.ink{fill:#0b0b0b;font-size:12px}
.ink2{fill:#52514e;font-size:12px}
.tick{fill:#898781;font-size:12px;font-variant-numeric:tabular-nums}
.grid{stroke:#e1e0d9;stroke-width:1}
.axis{stroke:#c3c2b7;stroke-width:1}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c1{stroke:#2a78d6}.d1{fill:#2a78d6}
.c2{stroke:#eb6834}.d2{fill:#eb6834}
.c3{stroke:#1baf7a}.d3{fill:#1baf7a}
.c4{stroke:#eda100}.d4{fill:#eda100}
.cb{stroke:#898781}.db{fill:#898781}
.ring{stroke:#fcfcfb;stroke-width:2}
.hollow{fill:#fcfcfb;stroke-width:2}
.glyph{fill:#52514e;stroke:#52514e}
.glyphStroke{stroke:#52514e}
.a1{fill:#2a78d6;fill-opacity:0.12}
.a2{fill:#eb6834;fill-opacity:0.12}
.a3{fill:#1baf7a;fill-opacity:0.12}
.a4{fill:#eda100;fill-opacity:0.12}
.ab{fill:#898781;fill-opacity:0.14}
.connector{stroke:#898781;stroke-width:2}
.leader{stroke:#898781;stroke-width:1}
.ref{stroke:#52514e;stroke-width:1.5}
.highlight{fill:none;stroke:#0b0b0b;stroke-width:1.5}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,0.10)}
.title,.ink{fill:#ffffff}
.sub,.ink2{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#383835}
.c1{stroke:#3987e5}.d1{fill:#3987e5}
.c2{stroke:#d95926}.d2{fill:#d95926}
.c3{stroke:#199e70}.d3{fill:#199e70}
.c4{stroke:#c98500}.d4{fill:#c98500}
.ring{stroke:#1a1a19}
.hollow{fill:#1a1a19}
.glyph{fill:#c3c2b7;stroke:#c3c2b7}
.glyphStroke{stroke:#c3c2b7}
.a1{fill:#3987e5;fill-opacity:0.16}
.a2{fill:#d95926;fill-opacity:0.16}
.a3{fill:#199e70;fill-opacity:0.16}
.a4{fill:#c98500;fill-opacity:0.16}
.ref{stroke:#c3c2b7}
.highlight{stroke:#ffffff}
}
</style>
<rect x="0.5" y="0.5" width="719.0" height="287.0" rx="8" class="bg"/>
<text x="24.0" y="30.0" class="title" text-anchor="start">Sharpe ratio: selection period vs test period</text>
<text x="24.0" y="50.0" class="sub" text-anchor="start">Parameters chosen on 2014–2019, then run unchanged on 2020–2024. Average of 29 symbols.</text>
<circle cx="29.0" cy="72.0" r="4.0" class="hollow glyphStroke"/>
<text x="40.0" y="76.0" class="ink2" text-anchor="start">2014–2019 (in sample)</text>
<circle cx="215.2" cy="72.0" r="5.0" class="glyph"/>
<text x="226.2" y="76.0" class="ink2" text-anchor="start">2020–2024 (out of sample)</text>
<line x1="190.0" y1="104.0" x2="190.0" y2="248.0" class="grid"/>
<text x="190.0" y="266.0" class="tick" text-anchor="middle">0.00</text>
<line x1="310.5" y1="104.0" x2="310.5" y2="248.0" class="grid"/>
<text x="310.5" y="266.0" class="tick" text-anchor="middle">0.20</text>
<line x1="431.0" y1="104.0" x2="431.0" y2="248.0" class="grid"/>
<text x="431.0" y="266.0" class="tick" text-anchor="middle">0.40</text>
<line x1="551.5" y1="104.0" x2="551.5" y2="248.0" class="grid"/>
<text x="551.5" y="266.0" class="tick" text-anchor="middle">0.60</text>
<line x1="672.0" y1="104.0" x2="672.0" y2="248.0" class="grid"/>
<text x="672.0" y="266.0" class="tick" text-anchor="middle">0.80</text>
<line x1="190.0" y1="104.0" x2="190.0" y2="248.0" class="axis"/>
<text x="174.0" y="132.0" class="ink" text-anchor="end">Mean reversion</text>
<line x1="513.2" y1="128.0" x2="320.1" y2="128.0" class="connector"/>
<circle cx="513.2" cy="128.0" r="5.0" class="hollow c1"/>
<circle cx="320.1" cy="128.0" r="6.0" class="ring d1"/>
<text x="525.2" y="132.0" class="ink2" text-anchor="start">0.54</text>
<text x="308.1" y="132.0" class="ink" text-anchor="end">0.22</text>
<text x="174.0" y="180.0" class="ink" text-anchor="end">MA crossover</text>
<line x1="456.1" y1="176.0" x2="309.7" y2="176.0" class="connector"/>
<circle cx="456.1" cy="176.0" r="5.0" class="hollow c2"/>
<circle cx="309.7" cy="176.0" r="6.0" class="ring d2"/>
<text x="468.1" y="180.0" class="ink2" text-anchor="start">0.44</text>
<text x="297.7" y="180.0" class="ink" text-anchor="end">0.20</text>
<text x="174.0" y="228.0" class="ink" text-anchor="end">Buy-and-hold</text>
<line x1="579.4" y1="224.0" x2="449.1" y2="224.0" class="connector"/>
<circle cx="579.4" cy="224.0" r="5.0" class="hollow cb"/>
<circle cx="449.1" cy="224.0" r="6.0" class="ring db"/>
<text x="591.4" y="228.0" class="ink2" text-anchor="start">0.65</text>
<text x="437.1" y="228.0" class="ink" text-anchor="end">0.43</text>
</svg>

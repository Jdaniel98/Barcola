<svg xmlns="http://www.w3.org/2000/svg" width="720.0" height="404.0" viewBox="0 0 720.0 404.0" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Walk-forward: average Sharpe ratio in each test year</title>
<desc id="chart-desc">Parameters re-chosen every year on the 3 years before it. Average of 6 symbols.</desc>
<style>

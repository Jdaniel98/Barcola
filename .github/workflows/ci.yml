name: CI
on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBARCOLA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Test under AddressSanitizer and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBARCOLA_SANITIZE=ON
          -DBARCOLA_WARNINGS_AS_ERRORS=ON -DBARCOLA_BUILD_APPS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install gcovr
        run: pip install gcovr==8.5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBARCOLA_COVERAGE=ON -DBARCOLA_BUILD_APPS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage report
        run: >
          mkdir -p coverage &&
          gcovr --root . --filter src/ --filter strategies/ --object-directory build
          --merge-mode-functions=separate --exclude-throw-branches --exclude-unreachable-branches
          --txt-summary --markdown-summary coverage/summary.md
          --html-details coverage/index.html --fail-under-line 85

      - name: Add the summary to the job page
        if: always()
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/

  format:
    name: Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install clang-format==18.1.8

      - name: Check formatting
        run: scripts/check_format.sh

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install clang-tidy
        run: pip install clang-tidy==18.1.8

      # Configuring is enough: it writes compile_commands.json and fetches GoogleTest
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang-tidy
        run: scripts/run_clang_tidy.sh build

  fuzz:
    name: Fuzz the CSV loader (libFuzzer)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBARCOLA_FUZZ=ON
          -DBARCOLA_WARNINGS_AS_ERRORS=ON -DBARCOLA_BUILD_APPS=OFF -DBARCOLA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --target fuzz_load_csv --parallel

      # New inputs go to corpus/; data/ and tests/fuzz/seeds/ seed it. -max_total_time can't
      # interrupt a hanging input, so -timeout fails one well before libFuzzer's 20-minute default.
      # libFuzzer sizes inputs from its largest seed; -max_len stops data/golden's 180 KB files
      # from slowing every run.
      - name: Fuzz for 60 seconds
        run: |
          mkdir corpus
          build/tests/fuzz/fuzz_load_csv -max_total_time=60 -timeout=30 -max_len=4096 corpus/ data/ tests/fuzz/seeds/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-crash
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*

  # Temporary, deleted later in this PR: both platforms' outputs with today's flags
  golden-measure:
    name: Golden measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBARCOLA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run the golden study
        run: scripts/run_golden.sh build golden-out

      # grep -c exits 1 on a count of 0, which is a valid answer here
      - name: Count fused multiply-adds
        run: |
          uname -m
          c++ --version | head -1
          for lib in build/strategies/libbarcola_strategies.a build/src/libbarcola.a; do
            echo "$lib: $(objdump -d --no-show-raw-insn "$lib" | grep -c fmadd || true)"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-${{ matrix.os }}
          path: golden-out

  golden-compare:
    name: Golden measure (compare platforms)
    needs: golden-measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      # A measurement, not a gate: differences are the result, so they don't fail the job
      - name: Compare
        run: |
          if diff -r golden-ubuntu-latest golden-macos-latest > golden.diff; then
            echo "Identical"
          else
            diff -rq golden-ubuntu-latest golden-macos-latest || true
            echo "Lines of diff: $(wc -l < golden.diff)"
            head -200 golden.diff | cut -c1-200
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-diff
          path: golden.diff
